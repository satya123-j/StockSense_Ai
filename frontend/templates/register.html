<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - StockSense AI</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body class="auth-wrapper">

  <div class="fintech-panel p-4" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-dropdown); background-color: #ffffff; border: 1px solid var(--border-default);">
    <div class="text-center mb-4">
      <div class="brand-icon-box mx-auto mb-2" style="width: 42px; height: 42px; font-size: 1.25rem;">SS</div>
      <h4 class="fw-bold mb-1" style="color: #111827;">Create Account</h4>
      <p class="text-secondary" style="font-size: 0.825rem;">Join StockSense AI for real-time market surveillance</p>
    </div>

    <div id="auth-error-alert" class="alert alert-danger py-2 px-3 mb-3" style="display: none; font-size: 0.8rem; border-radius: var(--radius-sm);"></div>

    <form id="register-form">
      <div class="mb-3">
        <label for="full_name" class="form-label text-secondary fw-semibold" style="font-size:0.75rem;">Full Name</label>
        <input type="text" id="full_name" class="topbar-search-input" placeholder="e.g. Rahul Sharma" required>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label for="username" class="form-label text-secondary fw-semibold" style="font-size:0.75rem;">Username</label>
          <input type="text" id="username" class="topbar-search-input" placeholder="e.g. rahul_trader" required autocomplete="username">
        </div>
        <div class="col-6">
          <label for="email" class="form-label text-secondary fw-semibold" style="font-size:0.75rem;">Email</label>
          <input type="email" id="email" class="topbar-search-input" placeholder="rahul@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label for="password" class="form-label text-secondary fw-semibold" style="font-size:0.75rem;">Password</label>
          <input type="password" id="password" class="topbar-search-input" placeholder="Min. 6 chars" required autocomplete="new-password">
        </div>
        <div class="col-6">
          <label for="confirm_password" class="form-label text-secondary fw-semibold" style="font-size:0.75rem;">Confirm</label>
          <input type="password" id="confirm_password" class="topbar-search-input" placeholder="••••••••" required autocomplete="new-password">
        </div>
      </div>

      <button type="submit" class="btn-fintech btn-fintech-primary w-100 py-2 mt-2">
        Create Account
      </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top border-subtle" style="font-size: 0.8rem;">
      <span class="text-secondary">Already registered?</span>
      <a href="/login" class="fw-bold ms-1" style="color: var(--accent-red);">Sign In</a>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
